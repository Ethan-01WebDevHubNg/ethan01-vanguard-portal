<script type="text/plain" id="team-data-script">
    window.setRole = function(role) {
        const inviteTpl = document.getElementById('tpl-invite-btn');
        const inviteContainer = document.getElementById('invite-btn-container');
        
        if (role === 'Super Admin' || role === 'Supreme Admin' || role === 'admin') {
            if (inviteTpl && inviteContainer && inviteContainer.children.length === 0) {
                inviteContainer.appendChild(inviteTpl.content.cloneNode(true));
            }
        } else {
            if (inviteContainer) inviteContainer.innerHTML = '';
        }
    };

    window.filterTeam = function(dept, btnElement, isInit = false) {
        document.querySelectorAll('.team-filter-btn').forEach(function(btn) {
            btn.classList.remove('text-primary');
            btn.classList.add('text-on-surface-variant');
        });
        btnElement.classList.remove('text-on-surface-variant');
        btnElement.classList.add('text-primary');
        
        const indicator = document.getElementById('tab-slide-indicator');
        const container = document.getElementById('team-tabs');
        if(indicator && container) {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnElement.getBoundingClientRect();
            const scrollLeft = container.scrollLeft;
            const targetLeft = (btnRect.left - containerRect.left) + scrollLeft;
            indicator.style.width = btnRect.width + 'px';
            indicator.style.transform = 'translateX(' + targetLeft + 'px)';
        }
        if(isInit) return;
        
        const cards = document.querySelectorAll('.team-card');
        let hidePromises = [];
        cards.forEach(function(card) {
            const isMatch = dept === 'all' || card.getAttribute('data-department') === dept;
            if (!isMatch && card.style.display !== 'none') {
                card.classList.remove('translate-y-0', 'opacity-100');
                card.classList.add('translate-y-4', 'opacity-0');
                hidePromises.push(new Promise(function(res) {
                    setTimeout(function() {
                        card.style.display = 'none';
                        res();
                    }, 300);
                }));
            }
        });
        
        Promise.all(hidePromises).then(function() {
            let showCards = [];
            cards.forEach(function(card) {
                const isMatch = dept === 'all' || card.getAttribute('data-department') === dept;
                if (isMatch) {
                    if (card.style.display === 'none') {
                        card.classList.remove('translate-y-0', 'opacity-100');
                        card.classList.add('translate-y-4', 'opacity-0');
                        card.style.display = 'block';
                        void card.offsetWidth;
                    }
                    showCards.push(card);
                }
            });
            showCards.forEach(function(card, index) {
                setTimeout(function() {
                    card.classList.remove('translate-y-4', 'opacity-0');
                    card.classList.add('translate-y-0', 'opacity-100');
                }, index * 50);
            });
        });
    };

    window.openInviteModal = function() {
        const m = document.getElementById('tpl-invite-modal').innerHTML;
        const a = document.getElementById('tpl-invite-action').innerHTML;
        if(window.Modal) window.Modal.show('Invite Agency Staff', m, a);
    };

    window.openContactModal = function(name, email, phone) {
        let m = document.getElementById('tpl-contact-modal').innerHTML;
        m = m.replace('{email}', email).replace('{phone}', phone);
        const a = document.getElementById('tpl-contact-action').innerHTML;
        if(window.Modal) window.Modal.show('Contact: ' + name, m, a);
    };

    window.currentEditMemberId = null;
    window.openEditMemberModal = function(memberId, name, phone, role, dept, email, avatarUrl) {
        // RBAC FIX: Reading from the correct global state variable
        const currentRole = window.ethan01_currentUser?.role;
        const isSuperAdmin = currentRole === 'admin' || currentRole === 'Super Admin' || currentRole === 'SuperAdmin'; 
        const isSelf = window.ethan01_currentUser && window.ethan01_currentUser.email === email;
        
        if (!isSuperAdmin && !isSelf) {
            if(window.Toast) window.Toast.show('Access Denied. Standard admins can only edit their own profile.', 'error');
            return;
        }

        window.currentEditMemberId = memberId;
        
        let m = document.getElementById('tpl-edit-member-modal').innerHTML;
        m = m.replace(/{name}/g, name).replace(/{phone}/g, phone || '')
             .replace(/{role}/g, role).replace(/{departmentLabel}/g, dept)
             .replace(/{avatarUrl}/g, avatarUrl || '/assets/icons/ethan01logo.svg')
             .replace(/{roleHiddenClass}/g, isSuperAdmin ? '' : 'hidden opacity-0 pointer-events-none');
             
        const a = `<button onclick="window.Modal.hide()" class="text-on-surface-variant hover:text-on-surface font-bold text-sm px-4 transition-colors">Cancel</button><button onclick="window.saveMemberEdit(this)" class="bg-primary text-[#09090b] px-6 py-2.5 rounded-lg font-bold text-sm transition-all shadow-[0_4px_15px_var(--color-primary-glow)]">Save Changes</button>`;
        
        if(window.Modal) window.Modal.show('Edit Profile: ' + name, m, a);
    };

    window.saveMemberEdit = async function(btn) {
        const id = window.currentEditMemberId;
        if(!id) return;
        
        btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Saving...`;
        btn.classList.add('opacity-50', 'pointer-events-none');

        try {
            const { db, storage } = await import('/js/config/firebase-dev.js');
            const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
            const { ref, uploadBytes, getDownloadURL } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js');

            const name = document.getElementById('edit-member-name').value;
            const phone = document.getElementById('edit-member-phone').value;
            const deptSelect = document.getElementById('edit-member-dept');
            const roleSelect = document.getElementById('edit-member-role');
            const avatarInput = document.getElementById('edit-avatar-input');

            let updates = {
                name: name,
                phone: phone
            };

            if(deptSelect && deptSelect.value) {
                updates.departmentLabel = deptSelect.options[deptSelect.selectedIndex].text;
                updates.department = deptSelect.value.toLowerCase();
                updates.role = roleSelect.value;
            }

            if(avatarInput && avatarInput.files.length > 0) {
                const file = avatarInput.files[0];
                const storageRef = ref(storage, `team_avatars/${id}_${file.name}`);
                await uploadBytes(storageRef, file);
                updates.avatarUrl = await getDownloadURL(storageRef);
            }

            await updateDoc(doc(db, 'team', id), updates);

            if(window.Modal) window.Modal.hide();
            if(window.Toast) window.Toast.show('Profile updated successfully.', 'success');

        } catch(e) {
            console.error(e);
            if(window.Toast) window.Toast.show('Failed to update profile.', 'error');
            btn.innerHTML = 'Save Changes';
            btn.classList.remove('opacity-50', 'pointer-events-none');
        }
    };

    window.sendTeamInvite = async function(btn) {
        const name = document.getElementById('invite-name')?.value;
        const phone = document.getElementById('invite-phone')?.value;
        const dept = document.getElementById('invite-dept')?.value;
        const role = document.getElementById('invite-role')?.value;
        const email = document.getElementById('invite-email')?.value;
        const password = document.getElementById('invite-password')?.value;
        const avatarInput = document.getElementById('invite-avatar-input');

        if(!email || !password || !name) {
            if(window.Toast) window.Toast.show('Name, Email and Password are required.', 'error');
            return;
        }

        btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Provisioning...`;
        btn.classList.add('opacity-50', 'pointer-events-none');

        try {
            const { db, storage, auth } = await import('/js/config/firebase-dev.js');
            const { doc, setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
            const { ref, uploadBytes, getDownloadURL } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js');
            const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
            const { getAuth, createUserWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

            const secondaryApp = initializeApp(auth.app.options, "TeamAuthApp_" + Date.now());
            const secondaryAuth = getAuth(secondaryApp);
            const userCred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
            const authUid = userCred.user.uid;
            await secondaryAuth.signOut();

            let avatarUrl = '';
            if(avatarInput && avatarInput.files.length > 0) {
                const file = avatarInput.files[0];
                const storageRef = ref(storage, `team_avatars/${authUid}_${file.name}`);
                await uploadBytes(storageRef, file);
                avatarUrl = await getDownloadURL(storageRef);
            }

            let deptLabel = dept.charAt(0).toUpperCase() + dept.slice(1);
            
            await setDoc(doc(db, 'team', authUid), {
                memberId: authUid,
                name: name,
                email: email,
                phone: phone || '',
                department: dept,
                departmentLabel: deptLabel,
                role: role,
                avatarUrl: avatarUrl,
                statusTitle: 'Active',
                statusColor: 'bg-secondary',
                statusShadow: 'var(--color-secondary)',
                accessRevoked: false,
                createdAt: serverTimestamp()
            });

            if(window.Modal) window.Modal.hide();
            if(window.Toast) window.Toast.show('Invitation sent and user provisioned.', 'success');

        } catch (error) {
            console.error(error);
            if(window.Toast) window.Toast.show('Failed to provision user: ' + error.message, 'error');
            btn.innerHTML = 'Send Invite';
            btn.classList.remove('opacity-50', 'pointer-events-none');
        }
    };

    window.activeContextMemberId = null;

    document.addEventListener('click', function(e) {
        const menu = document.getElementById('team-context-menu');
        if (menu && !menu.classList.contains('hidden')) {
            if (!menu.contains(e.target)) {
                menu.classList.add('opacity-0');
                setTimeout(() => menu.classList.add('hidden'), 150);
            }
        }
    });

    window.showTeamContextMenu = function(e, memberId) {
        e.preventDefault();
        
        // RBAC FIX: Reading from the correct global state variable
        const currentRole = window.ethan01_currentUser?.role;
        if (currentRole !== 'Super Admin' && currentRole !== 'admin' && currentRole !== 'SuperAdmin') {
            if (window.Toast) window.Toast.show('Super Admin clearance required to manage staff accounts.', 'error');
            return;
        }

        window.activeContextMemberId = memberId;
        const menu = document.getElementById('team-context-menu');
        menu.style.left = `${e.clientX}px`;
        menu.style.top = `${e.clientY}px`;
        menu.classList.remove('hidden');
        setTimeout(() => menu.classList.remove('opacity-0'), 10);
    };

    // SUSPEND USER ACTION
    window.revokeTeamAccess = function() {
        const id = window.activeContextMemberId;
        if(!id) {
            if(window.Toast) window.Toast.show('No user selected for suspension.', 'error');
            return;
        }
        
        const menu = document.getElementById('team-context-menu');
        menu.classList.add('opacity-0');
        setTimeout(() => menu.classList.add('hidden'), 150);

        const m = document.getElementById('tpl-revoke-team-modal').innerHTML;
        const a = document.getElementById('tpl-revoke-team-action').innerHTML;
        if(window.Modal) window.Modal.show('Suspend Login Access', m, a);
    };

    window.confirmRevokeTeamAccess = async function() {
        const id = window.activeContextMemberId;
        if(!id) return;
        
        if(window.Modal) window.Modal.hide();
        if(window.Toast) window.Toast.show('Suspending access...', 'info');

        try {
            const { db } = await import('/js/config/firebase-dev.js');
            const { doc, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
            await updateDoc(doc(db, 'team', id), {
                statusTitle: 'Suspended',
                statusColor: 'bg-error',
                statusShadow: 'var(--color-error)',
                accessRevoked: true
            });
            if(window.Toast) window.Toast.show('Staff access officially suspended.', 'warning');
        } catch(e) {
            console.error(e);
            if(window.Toast) window.Toast.show('Failed to suspend access.', 'error');
        }
    };

    // PERMANENT DELETE USER ACTION
    window.deleteTeamMember = function() {
        const id = window.activeContextMemberId;
        if(!id) {
            if(window.Toast) window.Toast.show('No user selected for deletion.', 'error');
            return;
        }
        
        const menu = document.getElementById('team-context-menu');
        menu.classList.add('opacity-0');
        setTimeout(() => menu.classList.add('hidden'), 150);

        const m = document.getElementById('tpl-delete-team-modal').innerHTML;
        const a = document.getElementById('tpl-delete-team-action').innerHTML;
        if(window.Modal) window.Modal.show('Permanently Delete Staff', m, a);
    };

    window.confirmDeleteTeamMember = async function() {
        const id = window.activeContextMemberId;
        if(!id) return;
        
        if(window.Modal) window.Modal.hide();
        if(window.Toast) window.Toast.show('Wiping staff profile...', 'info');

        try {
            const { db } = await import('/js/config/firebase-dev.js');
            const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
            await deleteDoc(doc(db, 'team', id));
            if(window.Toast) window.Toast.show('Team member safely wiped from database.', 'success');
        } catch(e) {
            console.error(e);
            if(window.Toast) window.Toast.show('Failed to delete staff member.', 'error');
        }
    };

    window.handleTeamHydration = function(e) {
        const payload = e.detail;
        if(!payload) return;
        const cont = document.getElementById('team-grid');
        const tpl = document.getElementById('tpl-team-card');
        
        const currentRole = window.ethan01_currentUser?.role;
        const isSuperAdmin = currentRole === 'Super Admin' || currentRole === 'admin' || currentRole === 'SuperAdmin';

        if(cont && tpl && payload.team) {
            cont.innerHTML = '';
            payload.team.forEach(member => {
                let html = tpl.innerHTML;
                const nameEscaped = member.name.replace(/'/g, '\\\'');
                const safeAvatar = member.avatarUrl || '/assets/icons/ethan01logo.svg';
                
                const canEdit = isSuperAdmin || (window.ethan01_currentUser && window.ethan01_currentUser.email === member.email);
                const isSuspended = member.accessRevoked === true || member.statusTitle === 'Suspended';
                
                html = html.replace(/{department}/g, member.department)
                           .replace(/{departmentLabel}/g, member.departmentLabel)
                           .replace(/{statusColor}/g, member.statusColor)
                           .replace(/{statusShadow}/g, member.statusShadow)
                           .replace(/{statusTitle}/g, member.statusTitle)
                           .replace(/{avatarUrl}/g, safeAvatar)
                           .replace(/{name}/g, member.name)
                           .replace(/{nameEscaped}/g, nameEscaped)
                           .replace(/{role}/g, member.role)
                           .replace(/{email}/g, member.email)
                           .replace(/{phone}/g, member.phone || '')
                           .replace(/{memberId}/g, member.id || member.memberId || '')
                           .replace(/{editHiddenClass}/g, canEdit ? '' : 'hidden opacity-0 pointer-events-none')
                           .replace(/{opacityClass}/g, isSuspended ? 'opacity-50 grayscale' : '')
                           .replace(/{strikeClass}/g, isSuspended ? 'line-through opacity-70' : '');
                cont.innerHTML += html;
            });
            
            if (window.ethan01_currentUser) {
                window.setRole(window.ethan01_currentUser.role);
            }
            
            const activeBtn = document.querySelector('.team-filter-btn.text-primary') || document.querySelector('.team-filter-btn');
            if (activeBtn) window.filterTeam('all', activeBtn, true);
        }
    };

    window.removeEventListener('vanguard-team-sync', window.handleTeamHydration);
    window.addEventListener('vanguard-team-sync', window.handleTeamHydration);
    
    console.log('[Vanguard] RTDB .info/connected listener ready for Team online status.');
</script>
